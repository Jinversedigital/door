<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://api.github.com https://gist.githubusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111110">

</head>
<body>
<!-- 公開的靜態頁：沒有外出網址、沒有密碼，也不知道要讀哪個 Gist。Gist 代號放在網址 # 後面。 -->
<main class="card" aria-live="polite">
  <p class="mark">Jinverse · 門牌</p>
  <h1 id="title">正在找工作室…</h1>
  <p id="msg" class="msg">讀取最新的外出網址。</p>
  <a id="go" class="btn" href="#" hidden>打開工作室</a>
  <p id="when" class="when" hidden></p>
  <div class="links">
    <a id="retry" href="#" hidden>重新整理</a>
    <a id="gist" href="#" rel="noreferrer" hidden>改看 Gist 上的網址</a>
  </div>
  <noscript><p class="msg">這一頁要開 JavaScript 才能找到工作室。</p></noscript>
</main>
<script src="door.js"></script>
</body>
</html>
